#!/usr/bin/env python
# -*- coding: utf-8 -*-
# Livox Mid-360S 标定外参动态调节定义 (base_link -> livox_frame)
# 拖动 rqt_reconfigure 滑条即可实时改变 TF, RViz 中点云随之移动。

PACKAGE = "neupan_ros"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

#       name     type       level  description          default   min     max
gen.add("x",     double_t,  0,     "X 前后偏移 (m)",     0.09563, -0.5,   0.6)
gen.add("y",     double_t,  0,     "Y 左右偏移 (m)",     0.0,     -0.3,   0.3)
gen.add("z",     double_t,  0,     "Z 高度偏移 (m)",     0.355,    0.0,   0.7)
gen.add("roll",  double_t,  0,     "Roll 横滚 (rad)",    0.0,     -0.5,   0.5)
gen.add("pitch", double_t,  0,     "Pitch 俯仰 (rad)",   0.0,     -0.5,   0.5)
gen.add("yaw",   double_t,  0,     "Yaw 偏航 (rad)",     0.0,     -3.15,  3.15)

# 第二/三参数: 节点名(仅文档用), 配置名前缀 -> 生成 LidarCalibConfig
exit(gen.generate(PACKAGE, "lidar_calib_tf", "LidarCalib"))
