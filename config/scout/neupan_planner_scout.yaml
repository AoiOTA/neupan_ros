# Scout Mini[室内窄道穿梭与瞬间闪避 终极数学重构版]
# 优化策略：解除物理转角封印 + 解耦姿态惩罚 + 短视野高反应 + 数学阻尼防抖

# ==========================================
# 1. MPC 模型预测控制全局视野 (缩短视野，专注眼下)
# ==========================================
receding: 16                  #[⭐ 核心破局 1：预测步数 H]
step_time: 0.15                #[⭐ 核心破局 1：时间步长 Δt]
                              # 【数学意义】视野 = 12 * 0.1 = 1.2 秒。
                              # 原来的 2.4s 太长！机器人在窄道内无法动弹时，提前预测到了外面的障碍，会导致内部优化冲突卡死。
                              # 改为 1.2s，它会在即将出洞的瞬间（距离0.36m时）才把注意力放在障碍物上，此时空间已足够其施展闪避动作。

ref_speed: 0.6                # [期望速度] 适当提速至 0.5m/s。有了优良的避障参数，不需要 0.3m/s 这么慢。
device: "cpu"                 
time_print: false             
collision_threshold: -1       

# ==========================================
# 2. 机器人物理模型与动力学可行域 F (解除物理封印)
# ==========================================
robot:
  kinematics: "diff"          
  length: 0.612               
  width: 0.58                 
  
  max_speed: [1.2, 3.14]       # 角速度上限提至 2.0 rad/s
  
  max_acce: [0.6, 0.2]        #[⭐ 核心破局 2：物理封印彻底解除！]
                              # 【数学意义】角加速度从 0.3 暴提至 1.5 rad/s²！
                              # 根据前面的数学积分推导，必须给车子 1.5 的角加速度，才能保证它在出洞后的 1 秒内，产生足够的横向侧滑位移绕开障碍物。

# ==========================================
# 3. 初始导航路径 (参考线)
# ==========================================
ipath:
  curve_style: 'line'         
  min_radius: 0.0
  loop: false
  interval: 0.05              
  arrive_threshold: 0.20      
  close_threshold: 0.10
  ind_range: 15
  arrive_index_threshold: 5

# ==========================================
# 4. PAN 网络算法引擎 (交替最小化)
# ==========================================
pan:
  iter_num: 3                 
  dune_max_num: 100           
  nrmp_max_num: 15            # 降至 15。出走廊面临大量墙壁杂点，只选最危险的 15 个，防止斥力杂乱干扰转向判定。
  dune_checkpoint: null
  iter_threshold: 0.05        

# ==========================================
# 5. NRMP 神经规划器权重 (⭐⭐⭐ 灵魂重构区)
# ==========================================
adjust:
  q_s: [1.5, 1.5, 0.2]       #[⭐ 核心破局 3：车头解绑 (降维向量化)]
                              # 【数学意义】把原本的标量 0.5 拆解！
                              # x, y 给 2.5，像无形的轨道车一样死死吸住中心线；
                              # theta(偏航角) 给 0.05（极弱惩罚）！出洞看到障碍物时，由于改变车头(θ)几乎不扣分，优化器会毫无心理负担地瞬间甩开车头。
  
  p_u: 3                   #[⭐ 核心破局 4：开启紧急刹车权限]
                              # 从 3 降为 1.5。当出洞发现 50cm 外有障碍，且横向位移紧迫时，允许规划器短暂牺牲线速度（将 0.5 降至 0.2），用速度换取宝贵的转向时间 T。
  
  ro_obs: 120                 # [避障斥力硬度] 提至 100，确保避障排斥力能够击穿寻迹拉力。
  
  d_max: 0.35                  #[动态安全气囊上限] 设为 0.3m。室内开阔地 30cm 安全距离足够了，太大容易导致转弯半径过大。
  
  d_min: 0.01                #[安全极限底线] 1.5cm。单侧6cm空隙，必须压榨底线保证不卡死。
  
  eta: 3.5                    #[⭐ 消除幽闭恐惧症]
                              # 从 5 降为 0.5。虚拟阻力壁垒 = η/ρ = 0.5/100 = 0.5cm。进窄道不再产生巨大的惩罚代价。
  
  bk: 0.1                     #[⭐ 核心破局 5：用数学取代物理防抖]
                              # 【数学意义】我们上面放开了角加速度(1.5)和车头权重(0.05)，车身现在极其灵活。
                              # 为了防止你担心的“原地磨胎”，我们将近端平滑项 bk 提到了 0.4！
                              # 公式 (bk/2)||s_h - \bar{s}_h||^2 会在全局时域上死死拉住两帧之间的轨迹，迫使它就算要急转弯，也必须画出一条优美、连续、向前的弧线，从数学层面彻底消灭原地打转。
  
  solver: "ECOS"