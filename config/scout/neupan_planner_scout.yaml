# Scout Mini [平滑/早转弯优化版]
# 优化目标：彻底解决差速车“转弯迟钝”和“原地磨胎（滑动摩擦）”问题
# 数学逻辑：拉长 MPC 预测时域 + 极高近端平滑惩罚 + 动力学硬约束 + 适度斥力

# ==========================================
# 1. MPC 模型预测控制全局视野 (决定前瞻能力)
# ==========================================
receding: 16                  # [预测步数 H]
step_time: 0.15               # [时间步长 Δt] 
                              # 【数学意义】总预测视野 H * Δt = 16 * 0.15 = 2.4 秒。
                              # 机器人在 NRMP 层求解时，会提前模拟未来 2.4 秒的轨迹。
                              # 这是解决“转弯迟”的根本：视野足够长，优化器才能在 2.4 秒外的远端感受到障碍物的排斥力，从而在当下就提前打方向，画出大圆弧。

ref_speed: 0.6                # [期望速度 u_speed] 目标函数 C0 中的理想巡航速度 (m/s)
device: "cpu"                 # [计算设备]
time_print: false             # [日志打印] 
collision_threshold: 0.01     #[物理碰撞阈值] 绝对物理检测底线 (1cm)，低于此值直接触发刹车停机。

# ==========================================
# 2. 机器人物理模型与动力学可行域 F
# ==========================================
robot:
  kinematics: "diff"          # [运动学模型] 差速模型，底层调用差速雅可比矩阵
  length: 0.612               # [几何约束] 构成形状矩阵 G 和向量 h
  width: 0.58                 # DUNE 神经编码器借此计算精确的 LDFs (点到车体边缘的绝对距离)
  
  max_speed: [1.2, 3.14]      # [速度边界] 线速度上限 1.2 m/s，角速度上限 3.14 rad/s (可行域 U 的硬约束)
  
  max_acce: [0.6, 0.3]        # [加速度边界] 解决“原地磨胎”的物理封印！(线加速度0.6, 角加速度0.3)
                              # 【数学意义】强制约束相邻时间步的速度差 (Δu)。
                              # 极其严格地将角加速度限制在 0.3 rad/s²，从物理上彻底禁止了差速车瞬间“扭头/原地转”的动作。
                              # 迫使 NRMP 优化器为了躲避前方障碍物，必须在空间上提前规划出一条【平滑的贝塞尔圆弧】。

# ==========================================
# 3. 初始导航路径 (参考线)
# ==========================================
ipath:
  curve_style: 'line'         # [参考线形状] 直线引导
  min_radius: 0.0
  loop: false
  interval: 0.05              # [路径点间隔] 5cm，提供给优化器极高密度的参考路点
  arrive_threshold: 0.20      # [终点容差] 距离终点 20cm 即判定到达
  close_threshold: 0.10
  ind_range: 15
  arrive_index_threshold: 5

# ==========================================
# 4. PAN 网络算法引擎 (交替最小化宏观调控)
# ==========================================
pan:
  iter_num: 3                 #[交替最小化次数 K] 
                              # 【数学意义】DUNE(算受力) 和 NRMP(算轨迹) 相互接力迭代的次数。
                              # 设为 3 次既能保证双凸问题稳定收敛（满足单调性），又能将控制延迟降到最低。
  
  dune_max_num: 100           # [DUNE 输入容量] 感知网络瞬间处理的最大原始雷达点数
  nrmp_max_num: 30            #[NRMP 约束容量] 
                              # 过滤给规划器的危险点数量。设为 30（偏高），让机器人在转弯时能感受到更宽广的“排斥力场”，有利于提早规划走线。
  dune_checkpoint: null
  iter_threshold: 0.05        #[收敛判定] 两次迭代轨迹误差小于 5cm 即提前终止计算，节省 CPU

# ==========================================
# 5. NRMP 神经规划器权重 (⭐⭐⭐ 决定走位性格的可微层参数)
# 对应终极目标函数 Q2_DPP 的各项权重
# ==========================================
adjust:
  q_s: 3.5                    # [基础寻迹代价 C0 权重 q]
                              # 【数学意义】约束机器人贴合参考线（蓝线）的执念。
                              # 设为 3.5（非常高），这意味着机器人极其渴望走在全局规划器给定的中心线上。
                              # 配合大视野，它会在避障后迅速且平滑地被“吸”回通道正中心，绝不偏航。
                              #[注：若发现差速车由于 q_s 过高导致摇头画龙，可将其升级为 3D 向量，如 [3.5, 3.5, 0.5]，降低对 Yaw 角的惩罚]
  
  p_u: 5                      #[速度服从代价 C0 权重 p]
                              # 【数学意义】惩罚机器人降速的力度。
                              # 设为 5（极高权重），配合 max_acce 的严格限制，鼓励机器人在过弯和避障时保持动能连贯。
                              # 这彻底消灭了“遇障先减速到0再打方向”的笨拙行为，强制其以匀速滑过弯道。
  
  ro_obs: 75                  # [神经避障惩罚 Cr 权重 ρ]
                              # 【数学意义】电子墙的“反弹硬度”。
                              # 设为 75（适中值）。如果设为 150，车会因为极其怕墙而绕出夸张的大弯；
                              # 降至 75，配合 2.4s 的远端视野，能让机器人既能提早触发偏航转弯，又敢于在极窄通道（70cm）中平滑贴边穿梭，不至于被排斥力死锁。
  
  d_max: 0.5                  #[动态安全距离上限 d_max]
                              # 在空旷地带，规划器会自动将气囊撑大到 0.5m，触发早避让机制。
  
  d_min: 0.01                 # [动态安全距离底线 d_min]
                              # 物理生死线 1cm！虽然我们鼓励早转弯，但遇到 70cm 的极限窄门时，该设定允许算法瞬间“收缩气囊”硬挤过去，保证通过率。
  
  eta: 0.5                    #[稀疏安全距离权重 η]
                              # 【数学意义】控制 d_t 逼近 d_max 的欲望。
                              # 设为 0.5（较低），降低了机器人对大安全距离的贪婪。这防止了机器人在窄通道口因为觉得“太挤”而不敢进，让其切入动作更果断。
  
  bk: 0.5                     #[⭐ 近端平滑项 Proximal Term 系数 b_k]
                              # 【数学意义】解决“原地磨胎”和“高频抖动”的究极数学锚点！
                              # 它是公式中的 (b_k/2) * ||s_h - \bar{s}_h||^2。
                              # 设为 0.5（极高权重），像一根强力阻尼弹簧，死死拉住当前轨迹，绝不允许当前帧算出的轨迹和上一帧有剧烈跳变。
                              # 这在数学上彻底过滤了差速器的高频震荡，强迫车辆像行驶在无形的高铁轨道上一样，输出极其平滑连贯的圆弧控制量。
  
  solver: "ECOS"              #[底层求解器] 用于高效求解转化后的 DPP 凸优化问题