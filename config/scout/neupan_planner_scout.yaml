# Scout Mini [平滑/早转弯优化版]
# 优化目标：解决“转弯迟”和“原地磨胎”问题
# 修改逻辑：限制角加速度强制走圆弧 + 扩大感知范围提早规划

# ==================== 全局设置 ====================
# [视野延长] 
# 原值 13 -> 新值 16
# 配合 0.15s 的步长，预测未来 2.4秒 的轨迹。
# 只有看得够远，才能在限制角速度的情况下提前开始打方向。
receding: 16
step_time: 0.15

# [保持] 稳健速度
ref_speed: 0.5
device: "cpu"
time_print: false

# [极限贴边] 保持窄阈值
collision_threshold: 0.08

# ==================== 机器人模型 ====================
robot:
  kinematics: "diff"
  length: 0.612
  width: 0.58
  
  # 速度限制
  max_speed: [1.0, 3.14]
  
  # [关键修改] 动力学约束 - 解决“转弯不顺/摩擦大”
  # 原值: [0.2, 0.6] -> 新值: [0.6, 0.35]
  # 1. 提高线加速度 (0.2->0.6): 让机器人入弯前能快速减速，出弯能快速回升速度。
  # 2. 压制角加速度 (0.6->0.35): 这是一个“物理封印”。
  #    禁止机器人进行剧烈的扭头动作，迫使优化器必须利用场地宽度，
  #    规划出一个平滑的大圆弧来绕过障碍。
  max_acce: [0.8, 0.6]

# ==================== 初始路径生成 ====================
ipath:
  curve_style: 'line'
  min_radius: 0.0
  loop: false
  interval: 0.05
  
  arrive_threshold: 0.20
  close_threshold: 0.10
  ind_range: 15
  arrive_index_threshold: 5

# ==================== 核心算法参数 ====================
pan:
  # [保持高频] 
  # 保持 3 次迭代。如果发现此时算力有富余，可尝试改为 5 以获得更优解。
  iter_num: 3
  
  dune_max_num: 100
  nrmp_max_num: 30
  dune_checkpoint: null
  iter_threshold: 0.05

# ==================== 权重调节 ====================
adjust:
  # [循迹修正]
  # 0.9 -> 1.2。
  # 稍微加强一点循迹意愿，防止在直道上因为角加速度被限制而产生不必要的游荡。
  q_s: 1.2
  
  # [动力保持]
  # 4.5 -> 5.0。
  # 给予足够的权重去追求参考速度，防止过弯时速度降得太低导致卡顿。
  p_u: 5.0
  
  # [早转弯核心] 障碍物斥力
  # 28 -> 45。
  # 增加斥力权重。这会让机器人在距离障碍物较远时就感觉到“代价”升高，
  # 从而配合长视野提早开始偏航。
  ro_obs: 45
  
  # [早转弯核心] 感知范围
  # 1.0/2.0 -> 3.5。
  # 彻底解决近视眼问题。必须看到 3.5米 以外的障碍物，
  # 算法才有空间去规划那条平滑的“大圆弧”。
  d_max: 3.5
  d_min: 0.05
  
  # [边界收紧]
  # 2.0 -> 1.6。
  # 稍微收紧软约束的边界，让机器人更倾向于在安全距离外解决战斗，
  # 而不是非要贴到脸上才利用软约束特性去硬挤。
  eta: 1.6
  
  bk: 0.5
  solver: "ECOS"