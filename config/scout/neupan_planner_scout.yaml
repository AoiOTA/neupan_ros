# Scout Mini [柔性避障版] 配置
# 针对症状：直线稳定但遇障急停、无法绕障、报 stop triggered
# 修正策略：降低循迹权重、大幅提升避障斥力、放宽急停阈值

# ==================== 全局设置 ====================
# [保持] 长预测视野，保证平滑
receding: 20
step_time: 0.15

# [保持] 稳健速度
ref_speed: 0.3
device: "cpu"
time_print: false

# [核心修正 1] 放宽急停阈值
# 0.15 -> 0.08。
# 既然你的雷达精度还可以，允许机器人贴得更近一点（8cm）再触发强制停车。
# 这给了算法在 8cm-15cm 之间进行微操绕路的空间，而不是直接锁死。
collision_threshold: 0.08

# ==================== 机器人模型 ====================
robot:
  kinematics: "diff"
  length: 0.65
  width: 0.60
  
  # 速度限制
  max_speed: [1.0, 1.0]
  
  # [保持] 物理“枷锁”，防止S型复发
  max_acce: [0.2, 0.5]

# ==================== 初始路径生成 ====================
ipath:
  curve_style: 'line'
  min_radius: 0.0
  loop: false
  interval: 0.05
  
  # [保持] 较宽的到达判定
  arrive_threshold: 0.20
  close_threshold: 0.10
  ind_range: 15
  arrive_index_threshold: 5

# ==================== 核心算法参数 ====================
pan:
  # [微调] 增加迭代次数，处理更复杂的避障解算
  iter_num: 8 
  dune_max_num: 300
  nrmp_max_num: 30
  dune_checkpoint: null
  iter_threshold: 0.05

# ==================== 权重调节 (核心修正区) ====================
adjust:
  # [核心修正 2] 降低循迹权重 (放权)
  # 2.0 -> 1.2
  # 告诉机器人："绿线只是参考，如果有障碍物，你可以偏离它"。
  # 不能降得太低（如0.5），否则S型摇摆会回来。1.2 是个折中值。
  q_s: 0.8
  
  # [微调] 速度权重
  # 保持 2.0，提供足够的动力去执行绕路动作
  p_u: 5
  
  # [核心修正 3] 大幅提升障碍物斥力 (恐惧感)
  # 200.0 -> 500.0
  # 让障碍物变得"非常烫"。一旦检测到障碍，这个巨大的惩罚项会瞬间压倒 q_s (循迹权重)，
  # 迫使优化器计算出一条大幅度偏离绿线的红线。
  ro_obs: 500.0
  
  # [微调] 缩小感知范围，但允许极近距离计算
  d_max: 1.0
  d_min: 0.05  # 0.1 -> 0.05，配合 collision_threshold，允许极限贴边
  
  eta: 10.0
  bk: 0.5
  solver: "ECOS"