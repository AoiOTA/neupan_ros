# =========================================================
# NeuPAN 规划器配置 - Scout Mini [作者建议-避障修正版]
# 针对问题: 遇障碍物徘徊、无法绕行
# =========================================================

# ==================== MPC 预测模型参数 ====================
# [回退] 作者未提及要修改预测步数，回退到标准值以保证计算实时性
# 步数过多会导致计算变慢，反而引起控制滞后
receding:  20                  
step_time: 0.15                 

# [回退] 速度建议先保持在安全范围
# 0.4 m/s 是室内测试最稳定的速度，速度过快会导致避障反应不及
ref_speed: 0.4                 

device:  'cpu'
time_print: false

# 碰撞阈值 (保持默认，太小不安全，太大导致过早停车)
collision_threshold: 0.20      

# ==================== 机器人物理参数 ====================
robot: 
  kinematics:  'diff'
  
  # [作者建议 - 核心修改 1] 
  # 线速度: 1.0 (标准)
  # 角速度: 3.14 (约180度/秒) -> 关键！
  # 解释: 只有具备极高的转向能力，MPC 才会计算出“原地急转绕开”的解。
  max_speed: [1.0, 3.14]
  
  # [隐式必要修改] 爆发力解锁
  # 必须配合 max_speed 修改。如果只有极速没有加速度，
  # 机器人会认为自己"提不起速"从而放弃转弯。
  max_acce: [1.0, 2.0]         
  
  length: 0.62                 
  width: 0.59

# ==================== 初始路径跟踪参数 ====================
ipath:
  interval: 0.1
  curve_style: 'line'
  min_radius: 0.0
  loop:  false
  # 到达阈值
  arrive_threshold: 0.15
  close_threshold: 0.05
  arrive_index_threshold: 0

# ==================== PAN 网络参数 ====================
pan: 
  iter_num: 5
  dune_max_num: 100
  nrmp_max_num: 10
  dune_checkpoint:  null
  iter_threshold: 0.1

# ==================== 权重调节参数 (核心博弈区) ====================
adjust: 
  # [作者建议 - 核心修改 2] 降低路径粘性 (关键!)
  # 2.0 -> 0.5
  # 解释: 允许机器人大幅度偏离全局路径(蓝线)。
  # 这是它敢于“离开直线”去绕开你的前提。
  q_s: 0.5                    
  
  # [作者建议 - 核心修改 3] 增加控制平滑度
  # 0.5 -> 2.0
  # 解释: 当 q_s 变小后，防止机器人左右乱晃(S形震荡)。
  # 强迫它画出平滑的圆弧。
  p_u: 2.0                    
  
  # [回退] 斥力保持标准
  # 保持对障碍物的敏感度
  eta: 15.0
  
  # [回退] 感知范围
  # 恢复到标准值，只关注 1.5米 内的障碍物，避免受远处环境干扰
  d_max: 1.5                 
  d_min: 0.1