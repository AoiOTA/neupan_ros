# =========================================================
# NeuPAN 规划器配置 - Scout Mini [修正·综合性能版]
# 核心逻辑: 解除软件僵化 + 保持硬件安全底线 + 强路径跟随
# =========================================================

# ==================== MPC 预测模型参数 ====================
# [保持] 视野充足
receding:  25                  
step_time: 0.15                 

# [保持] 你设定的 0.5 是可以的
# 只要不原地急转，这个速度在平地没问题
ref_speed: 0.5                 

device:  'cpu'
time_print: false

collision_threshold: 0.20      

# ==================== 机器人物理参数 ====================
robot: 
  kinematics:  'diff'
  
  # [硬件安全底线 - 适度放宽]
  # 线速度 1.0: 正常
  # 角速度 1.5 (约85度/秒): 
  # 解释: 1.0 实在太慢了导致绕不过去。1.5 是差速车的及格线。
  # 只要车在动，这个转速不会断电。
  max_speed: [1.0, 1.5]
  
  # [硬件安全底线 - 关键调整]
  # 线加速度 0.8: 稍微提一点，起步不那么肉。
  # 角加速度 1.5: 
  # 解释: 之前的 0.8 是导致"绕不过去"的主因。
  # 提至 1.5，让它有能力在遇到障碍时及时转头。
  # 只要不设到 3.0 以上，通常不会触发 BMS 保护。
  max_acce: [0.8, 1.5]         
  
  length: 0.62                 
  width: 0.59

# ==================== 初始路径跟踪参数 ====================
ipath:
  interval: 0.1
  curve_style: 'line'
  min_radius: 0.0
  loop:  false
  arrive_threshold: 0.15
  close_threshold: 0.05
  arrive_index_threshold: 0

# ==================== PAN 网络参数 ====================
pan: 
  iter_num: 5
  dune_max_num: 100
  nrmp_max_num: 10
  dune_checkpoint:  null
  iter_threshold: 0.1

# ==================== 权重调节参数 (核心博弈区) ====================
adjust: 
  # [关键修正 1] 增强路径粘性 (解决"一开始绕大弯")
  # 0.8 -> 2.0
  # 解释: 既然它一开始乱跑，就加大权重把它"吸"在蓝线上。
  # 强迫它起步就对准路径，不要画大圈。
  q_s: 1                
  
  # [关键修正 2] 彻底解除软件僵化 (解决"绕不过去")
  # 5.0 -> 0.2
  # 解释: 之前的 5.0 简直是给机器人打了石膏，脖子动不了。
  # 降到 0.2，允许它自由打方向盘。
  # 安全性由上面的 max_acce (1.5) 来兜底，不需要软件再限制了。
  p_u: 2                   
  
  # [修正] 恢复正常的避障反应
  # 5.0 -> 15.0
  # 解释: 恢复斥力，让它离障碍物远一点就开始规划绕行。
  # 配合 p_u=0.2，它现在可以灵活地画出绕行曲线了。
  eta: 15.0
  
  # [保持] 提早感知
  d_max: 2.0                 
  d_min: 0.1