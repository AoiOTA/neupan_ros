# =========================================================
# NeuPAN 规划器配置 - Scout Mini [S型震荡抑制版]
# 针对问题: 走S型、转弯过大、速度感太快
# =========================================================

# ==================== MPC 预测模型参数 ====================
receding:  20                  
step_time: 0.15                 

# [修正] 进一步降速
# 用户反馈 0.4 依然感觉太快，降至 0.3 (接近慢速步行)
# 慢速有助于减少 MPC 计算的震荡
ref_speed: 0.3                 

device:  'cpu'
time_print: false

collision_threshold: 0.20      

# ==================== 机器人物理参数 ====================
robot: 
  kinematics:  'diff'
  
  # [作者建议微调] 收敛转向能力
  # 3.14 (180度/秒) 对于 Scout Mini 这种宽车体来说太激进了，导致车头摆动过大。
  # 降至 2.0 (约115度/秒)，保留了避障能力，但更稳重。
  max_speed: [1.0, 2.0]
  
  # [配套微调] 限制角加速度
  # 2.0 -> 1.0
  # 防止“猛打方向盘”，让转向动作更柔和。
  max_acce: [1.0, 1.0]         
  
  length: 0.62                 
  width: 0.59

# ==================== 初始路径跟踪参数 ====================
ipath:
  interval: 0.1
  curve_style: 'line'
  min_radius: 0.0
  loop:  false
  arrive_threshold: 0.15
  close_threshold: 0.05
  arrive_index_threshold: 0

# ==================== PAN 网络参数 ====================
pan: 
  iter_num: 5
  dune_max_num: 100
  nrmp_max_num: 10
  dune_checkpoint:  null
  iter_threshold: 0.1

# ==================== 权重调节参数 (核心博弈区) ====================
adjust: 
  # [核心修正 1] 收紧路径约束 (解决 S 型走位)
  # 0.5 -> 1.2
  # 解释: 0.5 太松了，导致车“乱跑”。
  # 1.2 是一个折中值 (原版是2.0)，既允许它离开蓝线去避障，
  # 又强迫它避障后必须尽快回到蓝线，消除 S 型摆动。
  q_s: 1.2                    
  
  # [核心修正 2] 强力平滑控制
  # 2.0 -> 4.0
  # 解释: 作者建议增大 p_u。既然还在画龙，那就加倍增大。
  # 这个值越大，机器人越不愿意剧烈改变速度和方向，轨迹会变得非常圆润。
  p_u: 4.0                    
  
  # 斥力保持
  eta: 15.0
  
  # 感知范围保持
  d_max: 1.5                 
  d_min: 0.1