# NeuPAN 规划器配置 - Scout Mini
# 参考: neupan_ros/example/gazebo_limo/config/neupan_planner_limo.yaml

# ==================== MPC 参数 ====================
receding:  8                   # 预测步数 (Horizon)
step_time: 0.15               # 时间步长 (秒)
ref_speed: 0.5                # 期望巡航速度 (m/s) - 室内建议 0.3~0.6
device:  'cpu'                 # 计算设备
time_print: false             # 是否打印计算时间
collision_threshold: 0.05     # 碰撞检测阈值 (米)

# ==================== 机器人参数 ====================
robot: 
  kinematics:  'diff'          # 差速驱动
  max_speed: [1.0, 2.0]       # [最大线速度, 最大角速度]
  max_acce: [0.5, 1.0]        # [最大线加速度, 最大角加速度]
  length: 0.65                # 包络长度 (含安全余量)
  width: 0.60                 # 包络宽度 (含安全余量)

# ==================== 初始路径参数 ====================
ipath:
  interval: 0.1               # 路径点间隔 (米)
  waypoints: [[0, 0, 0]]      # 初始航点 (将由 global_planner 覆盖)
  curve_style: 'line'         # 曲线类型:  'line', 'dubins', 'reeds'
  min_radius: 0.0             # 最小转弯半径
  loop:  false                 # 是否循环路径
  arrive_threshold: 0.3       # 到达阈值 (米)
  close_threshold: 0.1        # 接近阈值 (米)
  arrive_index_threshold: 0   # 到达索引阈值

# ==================== PAN 网络参数 ====================
pan: 
  iter_num: 2                 # PAN 迭代次数
  dune_max_num: 100           # DUNE 最大考虑点数
  nrmp_max_num: 10            # NRMP 最大考虑点数
  dune_checkpoint:  null       # 将由 launch 文件覆盖
  iter_threshold: 0.1         # 迭代收敛阈值

# ==================== 调节参数 ====================
adjust: 
  q_s: 0.5                    # 路径追踪权重 (增大=更贴合全局路径)
  p_u: 3.0                    # 速度保持权重 (增大=更平滑)
  eta:  10.0                   # 约束软化参数
  d_max: 0.5                  # 最大感知距离 (米)
  d_min: 0.05                 # 最小安全距离 (米)