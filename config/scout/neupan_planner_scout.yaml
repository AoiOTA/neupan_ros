# NeuPAN 规划器配置 - Scout Mini [丝滑避障版]

# ==================== MPC 预测模型参数 ====================
receding:  10                  
step_time: 0.1                 # 提高时间分辨率，控制更细腻
                               
ref_speed: 0.5                 # 提高速度，利用动量克服摩擦
device:  'cpu'
time_print: false
collision_threshold: 0.15      # [关键] 放宽碰撞阈值，不再自己吓自己

# ==================== 机器人物理参数 ====================
robot: 
  kinematics:  'diff'
  max_speed: [1.5, 2.0]        # 物理上限放宽
  max_acce: [1.0, 2.0]         # 加速度放宽，响应更灵敏
  length: 0.62                 
  width: 0.59

# ==================== 初始路径跟踪参数 ====================
ipath:
  interval: 0.1
  curve_style: 'line'
  min_radius: 0.0
  loop:  false
  arrive_threshold: 0.25       # [关键] 到达阈值稍微大点，防止在终点处转圈调整
  close_threshold: 0.05
  arrive_index_threshold: 0

# ==================== PAN 网络参数 ====================
pan: 
  iter_num: 2                  # [关键] 稍微增加迭代次数，保证算出的解质量更高
  dune_max_num: 100
  nrmp_max_num: 10
  dune_checkpoint:  null
  iter_threshold: 0.1

# ==================== 权重调节参数 (最关键的修改) ====================
adjust: 
  # [重点] 允许偏离路径以避障
  # 值越小，避障能力越强，但也越不爱走直线
  q_s: 0.5                    
  
  # [重点] 极力维持速度，减少顿挫
  # 值越大，越不想停车
  p_u: 4.0                    
  
  eta:  10.0
  
  # [重点] 增大感知范围，提前规划避障路线
  d_max: 2.0                 
  d_min: 0.05