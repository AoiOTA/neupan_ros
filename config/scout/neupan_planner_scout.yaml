# NeuPAN 规划器配置 - Scout Mini [实验室高精度版]
# 优化目标: 平顺、稳定、贴边、防打滑

# ==================== MPC 预测模型参数 ====================
receding:  12                  # [优化] 预测步数 (原 10 -> 12)
                               # 看得更远一点，可以提前规划更平滑的转弯动作。
step_time: 0.2                 # 时间步长 (保持 0.2)
                               
ref_speed: 0.2                 # [优化] 期望巡航速度 (原 0.3 -> 0.2)
                               # 0.2 m/s 是极慢的速度，大约是扫地机器人的速度。
                               # 提供了充足的反应时间来处理复杂的桌腿障碍。

device:  'cpu'
time_print: false
collision_threshold: 0.03      # [优化] 碰撞检测阈值 (原 0.05 -> 0.03)
                               # 减小阈值，意味着机器人更大胆，敢于离障碍物更近。

# ==================== 机器人物理参数 (防打滑) ====================
robot: 
  kinematics:  'diff'
  
  # 物理极限硬锁 (保持低速)
  max_speed: [0.5, 1.0]
  
  # [核心优化] 大幅降低加速度，模拟“丝般顺滑”的起步
  # 这是防止在光滑地面打滑、保护里程计精度的最有效手段！
  max_acce: [0.3, 0.5]         # [最大线加速度, 最大角加速度]
  
  # 精确几何尺寸
  length: 0.62                 
  width: 0.59

# ==================== 初始路径跟踪参数 ====================
ipath:
  interval: 0.1
  waypoints: [[0, 0, 0]]
  curve_style: 'line'
  min_radius: 0.0
  loop:  false
  arrive_threshold: 0.1        # [优化] 到达目标的判定距离 (10cm)，停车更精准
  close_threshold: 0.05
  arrive_index_threshold: 0

# ==================== PAN 网络参数 ====================
pan: 
  iter_num: 3                  # [优化] 增加迭代次数，求解更精确
  dune_max_num: 100
  nrmp_max_num: 10
  dune_checkpoint:  null
  iter_threshold: 0.1

# ==================== 权重调节参数 (核心调优) ====================
adjust: 
  # [优化] 路径追踪权重 (Path Tracking)
  # 设为 5.0 (极高)，强迫机器人像火车一样在轨道上跑，死死贴住蓝线。
  # 适合走廊和窄门。
  q_s: 5.0                    
  
  # [优化] 速度保持权重 (Speed Keeping)
  # 设为 0.5 (较低)，允许机器人在需要时大幅减速，甚至停下来思考一下再走。
  p_u: 0.5                    
  
  eta:  10.0
  
  # [优化] 感知范围
  # 实验室环境障碍物近，设为 1.0 米足够，避免远处物体干扰。
  d_max: 1.0                 
  d_min: 0.05