# Scout Mini [当前实测参数 - 高频/软约束版]
# 当前状态：
# 1. 频率优化：iter_num=3, receding=12 (保证控制频率>30Hz)
# 2. 避障策略：软约束 (ro_obs=25, eta=1.5)，允许贴近障碍物
# 3. 存在隐患：d_max=1.0 (近视眼)，q_s=0.8 (循迹意愿太弱，容易绕大弯)

# ==================== 全局设置 ====================
# [性能折中] 缩短预测视野以提升频率
# 20 -> 12。
# 牺牲了一定的路径平滑度，换取更快的计算速度，减少延迟。
receding: 12
step_time: 0.15

# [保持] 稳健速度
ref_speed: 0.3
device: "cpu"
time_print: false

# [极限贴边] 极窄的急停阈值
# 0.08 (8cm)。
# 允许机器人在距离障碍物仅 8cm 时才触发强制急停。
# 这是实现“贴身绕障”的物理基础，防止算法过早锁死。
collision_threshold: 0.08

# ==================== 机器人模型 ====================
robot:
  kinematics: "diff"
  length: 0.65
  width: 0.60
  
  # 速度限制
  max_speed: [1.0, 1.0]
  
  # [保持] 物理“枷锁”，限制加速度防止S型摆动
  max_acce: [0.2, 0.5]

# ==================== 初始路径生成 ====================
ipath:
  curve_style: 'line'
  min_radius: 0.0
  loop: false
  interval: 0.05
  
  # [保持] 较宽的到达判定
  arrive_threshold: 0.20
  close_threshold: 0.10
  ind_range: 15
  arrive_index_threshold: 5

# ==================== 核心算法参数 ====================
pan:
  # [性能核心] 极低迭代次数
  # 3次。
  # 之前是8次。降到3次是为了确保控制频率能跑满，减少“一顿一顿”的现象。
  iter_num: 3
  
  # 采样点数
  dune_max_num: 100
  nrmp_max_num: 30
  dune_checkpoint: null
  iter_threshold: 0.05

# ==================== 权重调节 (关键修正区) ====================
adjust:
  # [弱循迹] 极低的循迹权重
  # 当前值: 0.8。
  # 含义：此时机器人对“走绿线”的意愿很弱。
  # 优点：遇到障碍物会毫不犹豫地偏离。
  # 缺点：容易导致绕弯幅度过大（因为不想回正），且直行时容易受干扰。
  q_s: 0.8
  
  # [强动力] 速度权重
  # 保持 5.0。
  # 提供足够的动力去执行动作，减少犹豫。
  p_u: 5
  
  # [软避障] 极低的障碍物斥力 (允许贴身)
  # 当前值: 25.0。
  # 注释修正：这不是500！25是非常低的值。
  # 含义：障碍物不再是“岩浆”，而是“墙壁”。机器人不再害怕靠近障碍物，
  # 这解决了“离得老远就躲开”的问题，但也可能导致它擦到东西。
  ro_obs: 25
  
  # [近视眼] 感知范围 (待优化项)
  # 当前值: 1.0。
  # 含义：只看1米内的东西。
  # 缺点：这就是视频中“到了跟前才急转弯”的直接原因。建议后续调大。
  d_max: 1.0
  d_min: 0.05
  
  # [软边界] 边界约束松弛度
  # 当前值: 1.5。
  # 含义：允许优化器在障碍物边缘寻找解，配合 ro_obs=25 使用。
  eta: 1.5
  
  bk: 0.5
  solver: "ECOS"