# =======================================================================
# NeuPAN 规划器配置 - Scout Mini [最终综合性能版]
#
# 核心策略: "降维打击"
# 通过极低的线速度，换取不断电的高扭矩转向能力和极小的物理转弯半径，
# 从而在狭窄空间中找到可行的避障路径。
#
# 解决了以下核心问题:
# 1. 断电: 严格限制了角速度和加速度，防止电机电流过载。
# 2. 无法绕行: 通过低速+中等角速度，获得了小于障碍物距离的物理转弯半径。
# 3. 原地抽搐: 提供了足够的角加速度以克服静摩擦力，同时用平滑权重抑制震荡。
# 4. 绕大弯: 增强了路径跟随权重，并降低了对远处障碍物的敏感度。
# =======================================================================

# ==================== MPC 预测模型参数 ====================
# [策略] 保持足够的视野来规划柔和的路径
receding:  25
step_time: 0.15

# [关键降速]
# 0.2 m/s。这是保证不断电和缩小转弯半径的物理基础。
# 只有速度足够慢，才能在不增加电流的前提下，缩小转弯半径。
ref_speed: 0.2

device:  'cpu'
time_print: false

# [安全] 允许贴近障碍物，为小半径转弯创造空间
collision_threshold: 0.15

# ==================== 机器人物理参数 ====================
robot:
  kinematics:  'diff'

  # [硬件安全底线 - 转向能力]
  # 线速度 0.6: 保持限制。
  # 角速度 1.2 (约68度/秒):
  # 解释: 之前 0.8 太僵硬了。1.2 是安全范围内能提供更小半径的值。
  # 配合 0.2 的线速度，最小转弯半径降至 0.16米，足以绕开障碍。
  max_speed: [0.6, 1.2]

  # [硬件安全底线 - 加速度]
  # 线加速度 0.5: 柔和。
  # 角加速度 1.5:
  # 解释: 提供了足够的"扭腰"力气以克服静摩擦，解决"抽搐"问题。
  # 因为此时线速度只有 0.2，整车动能很小，这个角加速度不会触发过流保护。
  max_acce: [0.5, 1.5]

  length: 0.62
  width: 0.59

# ==================== 初始路径跟踪参数 ====================
# (保持标准值)
ipath:
  interval: 0.1
  curve_style: 'line'
  min_radius: 0.0
  loop:  false
  arrive_threshold: 0.15
  close_threshold: 0.05
  arrive_index_threshold: 0

# ==================== PAN 网络参数 ====================
# (保持标准值)
pan:
  iter_num: 5
  dune_max_num: 100
  nrmp_max_num: 10
  dune_checkpoint:  null
  iter_threshold: 0.1

# ==================== 权重调节参数 (核心博弈区) ====================
adjust:
  # [关键平衡 1] 路径粘性 (解决绕大弯)
  # 3.0 -> 1.5
  # 解释: 之前的 3.0 把车绑死在蓝线上了。
  # 1.5 是一个黄金平衡点，允许它为了避障稍微偏离，但又不会偏离太远。
  q_s: 1.5

  # [关键平衡 2] 动作平滑度 (解决抽搐)
  # 保持适度阻尼，让动作连贯，不产生高频震荡。
  p_u: 2.0

  # [关键平衡 3] 障碍物斥力 (允许贴近)
  # 降低恐惧感，让机器人敢于靠近障碍物，执行小半径贴身绕行，
  # 而不是离很远就被吓停或绕大弯。
  eta: 5.0

  # [关键平衡 4] 感知范围 (专注眼前)
  # 配合低斥力，让机器人更专注于近处的障碍物，减少远处环境的干扰。
  d_max: 1.5
  d_min: 0.1