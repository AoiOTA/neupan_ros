# =========================================================
# NeuPAN 规划器配置 - Scout Mini [解死锁/绕行优先版]
# 针对问题: 障碍物在正前方时原地抽搐、无法绕行
# =========================================================

# ==================== MPC 预测模型参数 ====================
receding:  20                  
step_time: 0.15                 

# [保持] 速度保持用户满意的低速
ref_speed: 0.3                 

device:  'cpu'
time_print: false

collision_threshold: 0.20      

# ==================== 机器人物理参数 ====================
robot: 
  kinematics:  'diff'
  
  # [作者建议 - 调整] 提升转向上限
  # 2.0 -> 2.5
  # 解释: 面对正前方障碍物，机器人需要更大的转向能力来“摆脱”死锁。
  max_speed: [1.0, 2.5]
  
  # [配套调整] 极大提升角加速度 (解决抽搐的关键)
  # 1.0 -> 3.0
  # 解释: "抽搐"是因为想转但提不起速。
  # 给它极高的角加速度，让它在低速下也能瞬间完成转向动作，不再犹豫。
  max_acce: [1.0, 3.0]         
  
  length: 0.62                 
  width: 0.59

# ==================== 初始路径跟踪参数 ====================
ipath:
  interval: 0.1
  curve_style: 'line'
  min_radius: 0.0
  loop:  false
  arrive_threshold: 0.15
  close_threshold: 0.05
  arrive_index_threshold: 0

# ==================== PAN 网络参数 ====================
pan: 
  iter_num: 5
  dune_max_num: 100
  nrmp_max_num: 10
  dune_checkpoint:  null
  iter_threshold: 0.1

# ==================== 权重调节参数 (核心博弈区) ====================
adjust: 
  # [核心修正 1] 放权给避障 (解决绕不过去)
  # 1.2 -> 0.7
  # 解释: 之前的 1.2 把它绑得太死了。
  # 0.7 是一个平衡点，比 0.5 (完全乱跑) 稳，但比 1.2 (死锁) 灵活。
  # 它必须被允许偏离蓝线，才能绕开你。
  q_s: 0.7                    
  
  # [核心修正 2] 降低控制僵硬度 (解决原地抽搐)
  # 4.0 -> 1.0
  # 解释: 4.0 的惩罚太重了，导致机器人不敢大角度打方向盘。
  # 降回 1.0，允许它为了避障而做出剧烈的转向动作。
  p_u: 1.0                    
  
  # 斥力保持
  eta: 15.0
  
  # 感知范围保持
  d_max: 1.5                 
  d_min: 0.1