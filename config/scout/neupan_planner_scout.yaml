# Scout Mini [平滑/早转弯优化版]
# 优化目标：解决差速车“转弯迟钝”和“原地磨胎（滑动摩擦）”问题
# 数学逻辑：拉长 MPC 预测时域 + 增大近端平滑惩罚 + 释放动态安全距离弹性

# ==========================================
# 1. MPC 模型预测控制全局视野 (决定前瞻能力)
# ==========================================
receding: 16                  # [预测步数 H]
step_time: 0.15               #[时间步长 Δt] 
                              # 【数学意义】H * Δt = 16 * 0.15 = 2.4 秒。
                              # 机器人在 NRMP 层求解时，会提前模拟未来 2.4 秒的轨迹。
                              # 这是解决“转弯迟”的根本：只有预测时域足够长，优化器才能在远处感受到障碍物的排斥力，从而提前开始打方向。

ref_speed: 0.6                # [期望速度 u_speed] 目标函数 C0 中的理想巡航速度 (m/s)
device: "cpu"                 # [计算设备]
time_print: false             # [日志打印] 
collision_threshold: 0.01     # [物理碰撞阈值] 绝对物理检测底线 (1cm)

# ==========================================
# 2. 机器人物理模型与动力学可行域 F
# ==========================================
robot:
  kinematics: "diff"          # [运动学模型] 差速模型，底层公式调用 Eq. 36 的雅可比矩阵
  length: 0.612               #[几何约束] 构成形状矩阵 G 和向量 h，DUNE 神经编码器借此计算精确的 LDFs (点到边缘的绝对距离)
  width: 0.58
  
  max_speed: [1.2, 3.14]      # [速度边界] 线速度上限 1.2 m/s，角速度上限 3.14 rad/s (可行域 U 的硬约束)
  
  max_acce: [0.6, 0.3]        # [加速度边界] 解决“原地磨胎”的物理封印！
                              # 【数学意义】强制约束相邻时间步的速度差 (Δu)。
                              # 将角加速度严格限制在 0.6 rad/s²，禁止了差速车瞬间“扭头”的动作。
                              # 迫使 NRMP 优化器为了躲避前方的障碍物，必须在空间上规划出一条【平滑的大圆弧】，而不是走到跟前再原地死打方向盘。

# ==========================================
# 3. 初始导航路径 (参考线)
# ==========================================
ipath:
  curve_style: 'line'         # [参考线形状] 直线引导
  min_radius: 0.0
  loop: false
  interval: 0.05              # [路径点间隔] 提供给优化器参考的密集度
  arrive_threshold: 0.20      # [终点容差] 
  close_threshold: 0.10
  ind_range: 15
  arrive_index_threshold: 5

# ==========================================
# 4. PAN 网络算法引擎 (交替最小化宏观调控)
# ==========================================
pan:
  iter_num: 3                 #[交替最小化次数 K] 
                              # 【数学意义】DUNE(算受力) 和 NRMP(算轨迹) 相互接力迭代的次数。
                              # 设为 3 次能保证双凸问题稳定收敛（满足 Theorem 1 的单调性），距离场刻画更精确。
  
  dune_max_num: 100           # [DUNE 输入容量] 感知网络瞬间处理的最大原始雷达点数
  nrmp_max_num: 30            # [NRMP 约束容量] 
                              # 过滤给规划器的危险点数量。设为 30（偏高），让机器人在转弯时能感受到更宽广的“排斥力场”，有利于提早规划走线。
  dune_checkpoint: null
  iter_threshold: 0.05        # [收敛判定] 两次迭代轨迹误差小于 5cm 即提前终止计算

# ==========================================
# 5. NRMP 神经规划器权重 (⭐⭐⭐ 决定走位性格的可微层参数)
# 对应终极目标函数 Q2_DPP 的各项权重
# ==========================================
adjust:
  q_s: 3.5                  # [基础寻迹代价 C0 权重 q]
                              # 【数学意义】约束机器人贴合参考直线的意愿。
                              # 设为 0.9（不过分大），允许机器人在长视野（2.4s）下，为了避障而灵活地偏离参考线去走大圆弧。
  
  p_u: 5                      # [速度服从代价 C0 权重 p]
                              # 【数学意义】惩罚机器人降速。
                              # 设为 3（相对较高），配合 max_acce 的限制，鼓励机器人在过弯时保持动能连贯，防止车速降得太低导致卡顿。
  
  ro_obs: 75             #[神经避障惩罚 Cr 权重 ρ]
                              # 【数学意义】电子墙的“反弹硬度”。
                              # 设为 150，配合 2.4s 的视野，这会让机器人在距离障碍物较远时，其预测轨迹的末端就会感受到不可忽视的惩罚分，从而【提早触发偏航转弯】。
  
  d_max: 0.5                  # [动态安全距离上限 d_max]
                              # 在空旷地带，规划器会自动将气囊撑大到 0.5m，触发早避让机制。
  
  d_min: 0.01                 # [动态安全距离底线 d_min]
                              # 物理生死线 1cm！虽然我们鼓励早转弯，但万一遇到极窄地形，这个设定允许它瞬间“收缩气囊”硬挤过去。
  
  eta: 0.5                    #[稀疏安全距离权重 η]
                              # 【数学意义】控制 d_t 逼近 d_max 的欲望。
                              # 设为 0.5（较低），降低了机器人对大安全距离的贪婪。这防止了机器人在通道口因为觉得“太挤”而不敢进，让其动作更果断。
  
  bk: 0.5                     # [⭐ 近端平滑项 Proximal Term 系数 b_k]
                              # 【数学意义】解决“原地磨胎”和“抖动”的究极数学锚点！
                              # 它是公式中的 (b_k/2) * ||s_h - \bar{s}_h||^2。
                              # 设为 0.5（极高权重），像一根强力弹簧，死死拉住当前轨迹，绝不允许当前帧算出的轨迹和上一帧有剧烈跳变。
                              # 这在数学上过滤了差速器的高频震荡，强迫车辆像走钢轨一样输出极其平滑的圆弧控制量。
  
  solver: "ECOS"              # [底层求解器] 用于求解转化后的 DPP 凸优化问题