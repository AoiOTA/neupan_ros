# NeuPAN 规划器配置 - Scout Mini [柔和平衡版]
# 优化目标: 极低加速度防止乱窜，中等权重平衡避障与走线，只关注近处障碍

# ==================== MPC 预测模型参数 ====================
receding:  20                  
step_time: 0.15                 
                               
# [关键修改] 进一步降速
# 室内测试建议 0.4 m/s，这是绝对安全的速度
ref_speed: 0.4                 

device:  'cpu'
time_print: false

# 强制停车距离
collision_threshold: 0.25      

# ==================== 机器人物理参数 ====================
robot: 
  kinematics:  'diff'
  
  max_speed: [1.0, 1.5]
  
  # [核心修改] 物理硬锁 - 极低加速度
  # 线加速度 0.2，角加速度 0.3
  # 效果: 机器人启动像乌龟一样慢，绝对不会"猛冲"或"乱跑"
  max_acce: [0.2, 0.3]         
  
  length: 0.62                 
  width: 0.59

# ==================== 初始路径跟踪参数 ====================
ipath:
  interval: 0.1
  curve_style: 'line'
  min_radius: 0.0
  loop:  false
  arrive_threshold: 0.20       
  close_threshold: 0.05
  arrive_index_threshold: 0

# ==================== PAN 网络参数 ====================
pan: 
  iter_num: 5
  dune_max_num: 100
  nrmp_max_num: 10
  dune_checkpoint:  null
  iter_threshold: 0.1

# ==================== 权重调节参数 (平衡点) ====================
adjust: 
  # [平衡点] 路径追踪权重
  # 0.5 -> 2.0
  # 解释: 这是一个黄金值。既不会像 4.0 那样死板撞墙，也不会像 0.5 那样乱跑。
  q_s: 2.0                    
  
  # 速度保持权重
  p_u: 0.5                    
  
  # [优化] 适度的斥力
  # 15.0 -> 10.0
  # 解释: 降低一点恐惧感，防止它因为害怕障碍物而反应过度(乱打方向)。
  eta:  10.0
  
  # [核心修改] 缩小感知范围 ("近视眼"策略)
  # 2.0 -> 0.8
  # 解释: 只避让 0.8米 以内的东西。
  # 这样它就不会因为看到远处的墙而感到害怕，红线就会变直。
  d_max: 0.8                 
  d_min: 0.05