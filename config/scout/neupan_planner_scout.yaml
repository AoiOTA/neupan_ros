# NeuPAN 规划器配置 - Scout Mini [抗震荡稳定版]
# 优化目标: 消除 S 型走位，确保长距离导航稳定

# ==================== MPC 预测模型参数 ====================
# [关键修改] 增大预测视野，减小时间步长
# 作用: 让机器人看得更远(25步)，且反应更灵敏(0.15s)，有助于抑制震荡
receding:  25                  
step_time: 0.15                 
                               
# [关键修改] 确保 ref_speed <= max_speed
ref_speed: 0.8                 # 设定为 0.8 m/s，先求稳再求快

device:  'cpu'
time_print: false

# 碰撞检测阈值
# 0.20m 是一个平衡点，比 0.15 更保守一点，防止因定位抖动误判碰撞
collision_threshold: 0.20      

# ==================== 机器人物理参数 ====================
robot: 
  kinematics:  'diff'
  
  # 物理极限
  max_speed: [1.0, 1.5]        # 线速度 1.0，角速度 1.5
  
  # [关键修改] 限制加速度 (尤其是角加速度)
  # 限制在 0.5 以下可以有效减少“摆头”现象
  max_acce: [0.5, 0.5]         
  
  length: 0.62                 
  width: 0.59

# ==================== 初始路径跟踪参数 ====================
ipath:
  interval: 0.1
  curve_style: 'line'
  min_radius: 0.0
  loop:  false
  
  # [修正] 到达判定阈值
  # 0.20m，防止在终点为了那几厘米反复摩擦地面
  arrive_threshold: 0.20       
  
  close_threshold: 0.05
  arrive_index_threshold: 0

# ==================== PAN 网络参数 ====================
pan: 
  iter_num: 4                  # 适当增加迭代次数以获得更优解
  dune_max_num: 100
  nrmp_max_num: 10
  dune_checkpoint:  null
  iter_threshold: 0.1

# ==================== 权重调节参数 (S型修复核心) ====================
adjust: 
  # [S型修复核心 1] 路径追踪权重
  # 原 0.5 -> 改为 4.0
  # 作用: 像强力磁铁一样把车吸在全局路径上，禁止随意偏离。
  q_s: 4.0                    
  
  # [S型修复核心 2] 速度保持权重
  # 原 5.0 -> 改为 0.5
  # 作用: 降低对定速的执念。允许机器人在修正方向时减速，避免冲出路线。
  p_u: 0.5                    
  
  eta:  10.0
  
  # 感知范围
  # 减小到 1.0，专注于眼前的障碍，减少远端噪点导致的路径抖动
  d_max: 1.0                 
  d_min: 0.05