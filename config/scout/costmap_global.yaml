# 独立全局代价地图配置 - [窄道极限穿梭与全局缝合版]
# 架构说明：将动态避障全权交由底层的 NeuPAN (MPC) 处理。
# 全局地图仅使用静态地图，用于一次性生成、缝合并下发超长的“超级赛道”。

global_frame: map
robot_base_frame: base_link

# =========================================
# 1. 路径稳定性与频率设置
# =========================================
# 因为我们去掉了动态障碍物层，全局地图变成了纯静态的。
# 降低刷新频率（1.0Hz），因为静态地图不需要高频刷新，彻底释放 CPU 算力给 NeuPAN。
update_frequency: 1.0
publish_frequency: 1.0

# =========================================
# 2. 地图基础设置 (极限钻缝的核心基石)
# =========================================
static_map: true
rolling_window: false

# [关键修改] 亚像素级超高分辨率
# 提升分辨率到 0.025m (2.5cm)。在 70-80cm 通道（单侧冗余5cm）内，
# 5cm分辨率只有1个可用像素，极易死锁；2.5cm分辨率能提供足够的亚像素插值空间，让梯度更丝滑。
resolution: 0.025

# =========================================
# 3. 机器人物理足迹 (绝对不可使用 robot_radius)
# =========================================
# Scout Mini 的精确矩形轮廓。内切圆半径 Rin = 0.29m。
# 严格告诉算法：只有距离障碍物 <= 0.29m 时，才是物理死区(253)。
footprint: [[-0.306, -0.290],[-0.306, 0.290],[0.306, 0.290], [0.306, -0.290]]

# =========================================
# 4. 插件配置 (移除动态避障)
# =========================================
# 移除了 obstacle_layer。全局路径不会因为人走动而乱跳，保证“赛道”的绝对静态与稳定。
plugins:
  - {name: static_layer, type: "costmap_2d::StaticLayer"}
  - {name: inflation_layer, type: "costmap_2d::InflationLayer"}

static_layer:
  map_topic: /map
  subscribe_to_updates: true

# =========================================
# 5. 膨胀层配置 (人造重力峡谷，彻底消灭代价平原)
# =========================================
inflation_layer:
  # [反直觉的核心] 极限拉大膨胀半径
  # 设为 2.5m，让走廊和房间的每一个角落都被障碍物的“引力”覆盖。
  # 彻底消灭代价值为 0 的平原，让 A* 算法和梯度下降法始终有坡度可寻，实现“绝对居中”。
  inflation_radius: 2.5
  
  # [反直觉的核心] 极限压低衰减系数 (形成平缓 V 型槽)
  # 原默认值为 10.0 (阶梯状陡崖)。设为 2.5 后，斜坡变得极其平缓。
  # 【数学验算】：在 70cm 门中心(距离墙 0.35m)，代价 C = 252 * exp(-2.5 * (0.35-0.29)) ≈ 217。
  # 217 < 253，在物理和算法上绝对合法可通行，且处于 V 型峡谷的最底端！
  cost_scaling_factor: 2.5

transform_tolerance: 1.0