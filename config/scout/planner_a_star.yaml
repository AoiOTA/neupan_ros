# GlobalPlanner (A*) 完整配置文件
# 适用于 Scout Mini 底盘 + NeuPAN 局部规划器
# 对应源码: global_planner/planner_core.cpp

# =========================================
# 1. 算法结构选择 (初始化参数)
# =========================================
# 决定了节点启动时实例化哪个算法对象

# 使用 A* 算法 (true=Dijkstra, false=A*)
# A* 利用启发式搜索，在已知起点终点的情况下比 Dijkstra 快得多
use_dijkstra: false

# 使用二次函数近似计算势场 (true=Quadratic, false=Potential)
# 二次近似能生成更平滑的梯度，有利于生成非锯齿状路径
use_quadratic: true

# 路径生成方式 (true=GridPath, false=GradientPath)
# false 表示沿着势场梯度下降生成路径，比单纯走网格中心更平滑
use_grid_path: false

# 坐标对齐模式
# false = 新版行为，坐标对齐到栅格中心 (0.5)，更精确
old_navfn_behavior: false

# =========================================
# 2. 动态参数调优 (覆盖 .cfg 默认值)
# =========================================
# 这些参数必须显式设置，否则会回退到 .cfg 中不合理的默认值

# [关键] 代价因子 (默认 3.0 -> 改为 0.55)
# 定义：将 Costmap 像素值映射到 A* 代价的系数
# 调整理由：默认值 3.0 太保守，会导致机器人认为窄门是不可通行的。
#           0.55 让 Scout Mini 敢于贴近障碍物边缘通过。
cost_factor: 0.55

# [关键] 中性代价 (默认 50 -> 改为 66)
# 定义：经过无障碍区域的基础代价
# 调整理由：值越高，A* 越倾向于走直线（贪婪）；值越低，越倾向于 Dijkstra（搜索全图）。
#           66 是配合 lethal_cost=253 的经验值，能防止 A* 退化。
neutral_cost: 66

# 致命障碍物代价 (标准值 253)
lethal_cost: 253

# =========================================
# 3. 地图处理与安全边界
# =========================================

# 是否允许规划路径穿过未知区域 (灰色区域)
# 实车部署建议 false，安全第一，只走探索过的路
allow_unknown: false

# [关键] 地图边界保护
# true = 强制将地图最外围一圈设为致命障碍物
# 防止规划器因为地图边缘数据缺失而规划出地图之外
outline_map: true

# 目标点容差 (米)
# 0.0 表示必须精确到达目标栅格，如果目标被占据则规划失败
default_tolerance: 0.0

# =========================================
# 4. 路径朝向 (适配 NeuPAN)
# =========================================

# 方向模式 (默认 1 -> 改为 0)
# 0 = None (不规划方向，只给位置点)
# 1 = Forward (向前) ...
# 调整理由：后续的 NeuPAN 规划器会根据动力学模型自己决定朝向，
#           这里不需要强制指定，减少计算量并防止冲突。
orientation_mode: 0

# 方向平滑窗口 (配合 mode=0 其实不生效，但保留配置)
orientation_window_size: 1

# =========================================
# 5. 调试与性能
# =========================================

# [关键] 是否发布势场热力图 (默认 True -> 改为 False)
# 调整理由：cfg 默认开启，但这会消耗大量 CPU 发布 /potential 话题。
#           平时运行必须关闭，仅在调试路径奇怪时打开。
publish_potential: false

# 可视化缩放比例
publish_scale: 100