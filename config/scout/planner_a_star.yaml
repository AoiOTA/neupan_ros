# GlobalPlanner (A*) 完整配置 - [稳定性修复版]

# =========================================
# 1. 算法结构
# =========================================
use_dijkstra: false
use_quadratic: true

# [关键修正] 必须为 true
# 原理: false(梯度法)在复杂地图易数学求解失败; true(网格法)极其稳定。
use_grid_path: true

old_navfn_behavior: false

# =========================================
# 2. 代价权重
# =========================================
cost_factor: 0.55
# 降低中性代价，鼓励算法进行搜索
neutral_cost: 50
lethal_cost: 253

# =========================================
# 3. 容错与边界
# =========================================
# [关键修正] 允许穿越未知区域(灰色)，防止因地图微小缺失导致断路
allow_unknown: true

outline_map: true

# [关键修正] 目标点容差
# 允许目标点落在障碍物附近 0.5米 范围内，规划器会自动吸附到最近的空地
default_tolerance: 0.5

# =========================================
# 4. 其他
# =========================================
orientation_mode: 0
orientation_window_size: 1
publish_potential: false
publish_scale: 100