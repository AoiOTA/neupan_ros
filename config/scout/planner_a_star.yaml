# GlobalPlanner (A*) 空旷场地直冲版
# 优化目标: 在坚持使用 A* 的前提下，尽可能生成直线路径

# =========================================
# 1. 算法结构
# =========================================
# [用户要求] 坚持使用 A*
use_dijkstra: false

# [关键参数] 二次插值
# 必须开启，这能让潜在值的计算更平滑，是生成直线的数学基础
use_quadratic: true

# [核心抉择: 决定是走直线还是走楼梯]
# 方案 A (推荐): false。启用梯度下降法。在空旷场地 A* + 梯度法通常能成功，能走出完美的斜线。
# 方案 B (保守): true。如果不幸报错 "Failed to get a plan"，则改回 true，但路径会变回锯齿状。
use_grid_path: false

old_navfn_behavior: false

# =========================================
# 2. 代价权重 (核心调优)
# =========================================
cost_factor: 0.55

# [关键修改] 提高中性代价 (原 50 -> 66 或更高)
# 原理: 在 A* 中，提高这个值等于增加了"路程长短"在总代价里的比重。
# 效果: 强迫算法忽略地图上微小的代价值波动，一心一意走几何最短路径（也就是直线）。
neutral_cost: 66

lethal_cost: 253

# =========================================
# 3. 容错与边界
# =========================================
allow_unknown: true
outline_map: true

# 目标点吸附范围
default_tolerance: 0.5


# =========================================
# 4. 其他
# =========================================
orientation_mode: 0
orientation_window_size: 1
publish_potential: false
publish_scale: 100