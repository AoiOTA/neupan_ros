# GlobalPlanner (A*) 完整配置 - [长距离必达版]

# =========================================
# 1. 算法结构
# =========================================
use_dijkstra: false
use_quadratic: true

# [核心修正] 必须为 true (网格法)
# 原因: use_grid_path: false (梯度法) 在长距离下极易计算失败。
# 开启后保证一定能算出路，NeuPAN 会负责把锯齿拉直。
use_grid_path: true

old_navfn_behavior: false

# =========================================
# 2. 代价权重
# =========================================
cost_factor: 0.55

# [修正] 提高中性代价
# 有助于在网格搜索中拉出近似直线的路径
neutral_cost: 66

lethal_cost: 253

# =========================================
# 3. 容错与边界
# =========================================
allow_unknown: true
outline_map: true

# [修正] 增大容差
# 防止终点在墙边或障碍物边缘时，规划器直接放弃
default_tolerance: 1.0

# =========================================
# 4. 其他
# =========================================
orientation_mode: 0
orientation_window_size: 1
publish_potential: false
publish_scale: 100