# GlobalPlanner (A*) 完整配置 - [亚像素级平滑居中版]
# 架构说明：配合 2.5m 的大膨胀层，利用 A* 的低算力 + 梯度的极度平滑，生成完美的引导线。

# =========================================
# 1. 算法结构 (黄金平滑组合)
# =========================================
use_dijkstra: true    # 坚持使用 A* 算法，节省 CPU 算力
use_quadratic: true    # 使用二次近似计算势能场，让拐角处的势能曲面更加圆润
old_navfn_behavior: false

# [核心修改] 开启真实水流的梯度下降法
# 设为 false。水滴不再受限于 8 个离散的网格方向(告别折线锯齿)。
# 而是通过双线性插值，顺着刚才设置好的“代价峡谷”底部，流淌出完美的贝塞尔曲线。
use_grid_path: false   

# =========================================
# 2. 代价权重 (极限穿梭的博弈逻辑)
# =========================================
# [压低] 地图代价因子 (Costmap 敏感度)
# 设为 0.8。
# 作用：在 70cm 窄门中，代价高达 217。如果此值过大（如 3.0），A* 会觉得钻门太痛苦，
# 宁愿绕着大楼走一圈也不穿过去。压低到 0.8，让 A* 勇敢地接受窄门的挤压感。
cost_factor: 0.8

# [提高] 中性代价 (走路体力成本)
# 设为 66 (默认通常为50)。
# 作用：提高基础的距离惩罚。告诉 A*："绕远路也是很累的"。
# 配合 cost_factor=0.8，形成博弈：钻 1 米的窄门(痛苦度 239)，远好于绕 4 米的远路(痛苦度 264)。
neutral_cost: 66

# 物理致死底线 (绝不能改)
# 对应 Costmap 的 Inscribed 区域，一旦超过，A* 直接抛弃路线。
lethal_cost: 253

# =========================================
# 3. 容错与边界
# =========================================
allow_unknown: false
outline_map: true
default_tolerance: 1.0

# =========================================
# 4. 其他
# =========================================
orientation_mode: 0
orientation_window_size: 1
publish_potential: false
publish_scale: 100